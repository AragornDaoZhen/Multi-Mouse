[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multimouse"
version = "1.0.0"
description = "Use multiple physical mice independently on Windows — each with its own cursor and click target"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "AragornDaoZhen"}]
keywords = ["windows", "mouse", "multi-cursor", "raw-input", "dual-mouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/AragornDaoZhen/Multi-Mouse"
Repository = "https://github.com/AragornDaoZhen/Multi-Mouse"

[project.scripts]
multimouse = "src.multi_mouse:main"

[tool.setuptools.packages.find]
where = ["."]
